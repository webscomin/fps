  cycle(d) { if (!this.gloryActive) this.select(this.idx + d); }
  refill() { for (const w of this.weapons) w.ammo = w.cfg.maxAmmo; }

  // Попытка запуска добивания (клавиша E)
  tryGloryKill(zombies) {
    if (this.gloryActive || this.player.isDead || this.player.dashTimer > 0) return;
    const P = this.player, cam = this.camera;
    cam.getWorldDirection(this.dir);

    let bestZ = null, bestDist = CONFIG.glory.range;

    for (const z of zombies) {
      if (!z.alive || z.state !== "stunned") continue;
      const toZ = z.pos.clone().sub(P.pos);
      const d = toZ.length();
      if (d > bestDist) continue;

      toZ.normalize();
      const dot = this.dir.dot(toZ);
      if (dot < Math.cos(CONFIG.glory.angle * Math.PI / 180)) continue;

      // Проверка стен
      let blocked = false;
      for (const b of this.world.boxes) {
        const h = rayAABB(cam.position, toZ, b.min, b.max, 0.1);
        if (h && h.t < d - 0.5) { blocked = true; break; }
      }
      if (!blocked) {
        bestZ = z;
        bestDist = d;
      }
    }

    if (!bestZ) return;

    // Расчёт точки остановки перед зомби (дистанция 1.3м)
    const stopDir = P.pos.clone().sub(bestZ.pos);
    stopDir.y = 0;
    if (stopDir.length() > 0.001) stopDir.normalize(); else stopDir.set(0, 0, 1);
    const dest = bestZ.pos.clone().addScaledVector(stopDir, 1.3);
    dest.y = bestZ.pos.y;

    // Проверка коллизий точки назначения со стенами
    const r = CONFIG.player.radius, h = CONFIG.player.height;
    for (const b of this.world.boxes) {
      if (dest.x + r > b.min.x && dest.x - r < b.max.x &&
          dest.z + r > b.min.z && dest.z - r < b.max.z &&
          dest.y + h > b.min.y && dest.y < b.max.y) {
        return; // путь заблокирован блоком
      }
    }

    // Старт добивания
    this.gloryActive = true;
    this.gloryTarget = bestZ;
    this.gloryTimer = 0;
    this.gloryExecuted = false;
    this.gloryStartPos.copy(P.pos);
    this.gloryTargetPos.copy(dest);
    this.gloryType = ["punch", "rip", "kick"][Math.floor(Math.random() * 3)];
    P.invulnT = this.gloryDuration + 0.3;
    this.game.timeScale = CONFIG.glory.timeScale;
    this.ui.gloryVignette.style.opacity = "1";
  }

  cast(o, d, maxT, r, zombies) {
    let bt = maxT, ba = -1, bs = 0, tg = null, zm = null, isHead = false;

    for (const b of this.world.boxes) {
      const h = rayAABB(o, d, b.min, b.max, r);
      if (h && h.t < bt) { bt = h.t; ba = h.a; bs = h.s; tg = null; zm = null; }
    }
    if (d.y < -1e-9) {
      const t = (r - o.y) / d.y;
      if (t >= 0 && t < bt) { bt = t; ba = 1; bs = 1; tg = null; zm = null; }
    }
    for (const t of this.targets) {
      if (!t.alive) continue;
      const h = rayAABB(o, d, t.min, t.max, r);
      if (h && h.t < bt) { bt = h.t; ba = h.a; bs = h.s; tg = t; zm = null; }
    }
    if (zombies) {
      for (const z of zombies) {
        if (!z.alive) continue;
        const hh = rayAABB(o, d, z.headMin, z.headMax, r);
        if (hh && hh.t < bt) {
          bt = hh.t; ba = hh.a; bs = hh.s; zm = z; tg = null; isHead = true;
          continue;
        }
        const hb = rayAABB(o, d, z.bodyMin, z.bodyMax, r);
        if (hb && hb.t < bt) {
          bt = hb.t; ba = hb.a; bs = hb.s; zm = z; tg = null; isHead = false;
        }
      }
    }

    if (ba < 0) return null;
    this.hn.set(0, 0, 0); this.hn[AX[ba]] = bs;
    this.hp.copy(o).addScaledVector(d, bt).addScaledVector(this.hn, -r);
    this.hit.t = bt; this.hit.target = tg; this.hit.zombie = zm; this.hit.isHead = isHead;
    return this.hit;
  }

  spreadDir(out, deg) {
    const a = Math.tan(deg * Math.PI / 180), r = Math.sqrt(Math.random()) * a, ph = Math.random() * 6.2832;
    return out.copy(this.dir).addScaledVector(this.right, Math.cos(ph) * r).addScaledVector(this.up, Math.sin(ph) * r).normalize();
  }

  damageTarget(t, d) {
    const killed = t.hit(d, this.fx);
    if (killed) this.hitKill = true; else if (this.hitT <= 0) this.hitKill = false;
    this.hitT = 0.18;
  }

  damageZombie(z, d, isHead, pushVec) {
    z.takeDamage(d, isHead, pushVec, this.fx, this.game);
    if (!z.alive) this.hitKill = true; else if (this.hitT <= 0) this.hitKill = false;
    this.hitT = 0.18;
  }

  fire(W, zombies) {
    if (this.gloryActive) return;
    const c = W.cfg, P = this.player, cam = this.camera;
    cam.getWorldDirection(this.dir);
    this.right.set(1, 0, 0).applyQuaternion(cam.quaternion);
    this.up.set(0, 1, 0).applyQuaternion(cam.quaternion);
    W.ammo--; W.cool = c.cooldown;

    for (const z of zombies) {
      if (z.alive && z.pos.distanceTo(P.pos) < CONFIG.enemies.zombie.alertRadius) z.alert();
    }

    if (W.id === "shotgun") {
      const dmTargets = new Map();
      const dmZombies = new Map();

      for (let i = 0; i < c.pellets; i++) {
        const h = this.cast(cam.position, this.spreadDir(this.tmpC, c.spread), c.range, 0, zombies);
        if (!h) continue;
        let k = 1;
        if (h.t > c.falloffStart) k = 1 - (1 - c.falloffMin) * Math.min(1, (h.t - c.falloffStart) / (c.range - c.falloffStart));
        const pDmg = c.damage * k;

        if (h.zombie) {
          const entry = dmZombies.get(h.zombie) || { dmg: 0, isHead: false, push: new THREE.Vector3() };
          entry.dmg += pDmg;
          if (h.isHead) entry.isHead = true;
          entry.push.addScaledVector(this.tmpC, c.pushEnemy * 0.1);
          dmZombies.set(h.zombie, entry);
        } else if (h.target) {
          dmTargets.set(h.target, (dmTargets.get(h.target) || 0) + pDmg);
        } else {
          this.fx.decal(this.hp, this.hn, 0x1b1340, 0.4);
        }
        this.fx.sparks(this.hp, this.hn, 0xffd23f, 3);
      }

      for (const [t, d] of dmTargets) this.damageTarget(t, d);
      for (const [z, entry] of dmZombies) this.damageZombie(z, entry.dmg, entry.isHead, entry.push);

      if (!P.onGround) P.vel.addScaledVector(this.dir, -c.airPush);
    } else {
      const p = this.pools[W.id].find(q => !q.on);
      if (p) {
        this.spreadDir(this.tmpC, c.spread || 0);
        p.on = true; p.life = c.life; p.dmg = c.damage; p.r = c.projRadius; p.trail = 0;
        p.vel.copy(this.tmpC).multiplyScalar(c.projSpeed);
        p.from.copy(cam.position);
        p.pos.copy(cam.position).addScaledVector(this.dir, 0.6).addScaledVector(this.right, 0.2).addScaledVector(this.up, -0.15);
        p.m.lookAt(this.tmpA.copy(p.pos).add(p.vel)); p.m.visible = true;
      }
    }

    P.recoil += c.recoil * Math.PI / 180;
    P.addShake(c.shake, c.shakeTime);
    this.kick = c.kickBack; this.flashT = 0.05; this.lightT = 0.08;
  }

  explode(pt, zombies) {
    const c = CONFIG.weapons.rocket, R = c.explosionRadius, P = this.player;
    this.fx.explosion(pt);

    for (const t of this.targets) {
      if (!t.alive) continue;
      const dx = pt.x - Math.max(t.min.x, Math.min(pt.x, t.max.x)), dy = pt.y - Math.max(t.min.y, Math.min(pt.y, t.max.y)),
            dz = pt.z - Math.max(t.min.z, Math.min(pt.z, t.max.z));
      const d = Math.hypot(dx, dy, dz);
      if (d < R) { const dm = Math.round(c.explosionDamage * (1 - d / R)); if (dm > 0) this.damageTarget(t, dm); }
    }

    for (const z of zombies) {
      if (!z.alive) continue;
      const d = z.pos.distanceTo(pt);
      if (d < R) {
        const falloff = 1 - d / R;
        const dm = Math.round(c.explosionDamage * falloff);
        const pushVec = z.pos.clone().sub(pt);
        if (pushVec.length() > 1e-4) pushVec.normalize(); else pushVec.set(0, 1, 0);
        pushVec.multiplyScalar(c.pushEnemy * falloff);
        if (dm > 0) this.damageZombie(z, dm, false, pushVec);
      }
    }

    this.tmpA.set(P.pos.x, P.pos.y + 0.9, P.pos.z).sub(pt);
    const d = this.tmpA.length();
    if (d < R) {
      const f = c.jumpForce * (1 - d / R);
      if (d > 1e-4) this.tmpA.divideScalar(d); else this.tmpA.set(0, 1, 0);
      if (this.tmpA.y > 0 && P.vel.y < 0) P.vel.y = 0;
      P.vel.addScaledVector(this.tmpA, f);
      if (f * this.tmpA.y > 2) P.onGround = false;
    }
    P.addShake(0.05 * Math.max(0, 1 - d / 18), 0.35);
  }

  updateProjectiles(dt, zombies) {
    for (const kind in this.pools) for (const p of this.pools[kind]) {
      if (!p.on) continue;
      p.life -= dt;
      if (p.life <= 0) { p.on = false; p.m.visible = false; continue; }
      this.tmpA.copy(p.pos).addScaledVector(p.vel, dt);
      this.tmpB.subVectors(this.tmpA, p.from);
      const len = this.tmpB.length(); this.tmpB.divideScalar(len);
      const h = this.cast(p.from, this.tmpB, len, p.r, zombies);
      if (h) {
        p.on = false; p.m.visible = false;
        if (kind === "plasma") {
          if (h.zombie) {
            const push = p.vel.clone().normalize().multiplyScalar(CONFIG.weapons.plasma.pushEnemy);
            this.damageZombie(h.zombie, p.dmg, h.isHead, push);
          } else if (h.target) {
            this.damageTarget(h.target, p.dmg);
          } else {
            this.fx.decal(this.hp, this.hn, 0x1b1340, 0.45);
          }
          this.fx.sparks(this.hp, this.hn, 0x7ffcff, 8);
        } else {
          if (!h.target && !h.zombie) this.hp.addScaledVector(this.hn, 0.05);
          this.explode(this.hp, zombies);
        }
        continue;
      }
      p.from.copy(p.pos); p.pos.copy(this.tmpA);
      if (kind === "rocket" && (p.trail -= dt) <= 0) {
        p.trail = 0.03;
        this.fx.spawn(p.pos.x, p.pos.y, p.pos.z, rnd(0.4), rnd(0.4), rnd(0.4), 0x9a98b8, 0.2, 0.6, 0, 1);
        this.fx.spawn(p.pos.x, p.pos.y, p.pos.z, rnd(0.3), rnd(0.3), rnd(0.3), 0xff9a2a, 0.12, 0.2, 0, 0);
      }
    }
  }

  updateGloryKill(dt) {
    if (!this.gloryActive) return;
    this.gloryTimer += dt;
    const P = this.player;

    // 1. Быстрый подлёт к врагу за первые 0.15 сек
    if (this.gloryTimer <= CONFIG.glory.dashDuration) {
      const t = this.gloryTimer / CONFIG.glory.dashDuration;
      P.pos.lerpVectors(this.gloryStartPos, this.gloryTargetPos, t);
      P.vel.set(0, 0, 0);
    }

    // Смотрим точно на зомби
    if (this.gloryTarget && this.gloryTarget.alive) {
      const dx = this.gloryTarget.pos.x - P.pos.x, dz = this.gloryTarget.pos.z - P.pos.z;
      P.yaw = Math.atan2(-dx, -dz);
      P.pitch = -0.1;
    }

    // Анимация удара в зависимости от типа
    const prog = Math.min(1, this.gloryTimer / this.gloryDuration);
    if (this.gloryType === "punch") {
      this.kick = -Math.sin(prog * Math.PI) * 2.8;
      this.view.position.x = 0.3 - Math.sin(prog * Math.PI) * 0.15;
    } else if (this.gloryType === "rip") {
      this.kick = Math.sin(prog * Math.PI * 2) * 1.8;
      this.view.position.y = -0.27 + Math.sin(prog * Math.PI) * 0.2;
    } else { // kick
      this.kick = Math.sin(prog * Math.PI) * 3.5;
      P.camera.rotation.z = Math.sin(prog * Math.PI) * 0.18;
    }

    // Момент расправы (на 0.38 сек)
    if (!this.gloryExecuted && this.gloryTimer >= 0.38) {
      this.gloryExecuted = true;
      if (this.gloryTarget && this.gloryTarget.alive) {
        this.fx.popup(this.gloryTarget.pos.x, this.gloryTarget.pos.y + 2.2, this.gloryTarget.pos.z, "ДОБИВАНИЕ!", true);
        const push = new THREE.Vector3(0, 4, -20).applyAxisAngle(new THREE.Vector3(0, 1, 0), P.yaw);
        this.gloryTarget.die(true, push, this.fx, this.game, true, true);
        P.addShake(0.06, 0.3);
      }
    }

    // Завершение добивания
    if (this.gloryTimer >= this.gloryDuration) {
      this.gloryActive = false;
      this.gloryTarget = null;
      this.game.timeScale = 1.0;
      this.ui.gloryVignette.style.opacity = "0";
      this.view.position.set(0.3, -0.27, -0.5);
      P.camera.rotation.z = 0;
    }
  }

  updateView(dt) {
    const P = this.player, g = this.view;
    this.appear = Math.min(1, this.appear + dt / 0.25);
    this.kick *= Math.exp(-14 * dt);
    const sp = P.onGround ? Math.min(1, Math.hypot(P.vel.x, P.vel.z) / CONFIG.moveSpeed) : 0;
    this.bobA += (sp - this.bobA) * Math.min(1, dt * 10); this.bobT += dt * 10 * sp;
    const e = 1 - Math.pow(1 - this.appear, 3);

    const dashK = P.dashTimer > 0 ? (P.dashTimer / CONFIG.dashDuration) : 0;
    const dashTilt = dashK * 0.2;
    const switchTilt = (1 - e) * 0.35;

    if (!this.gloryActive) {
      g.position.set(
        0.3 + Math.sin(this.bobT) * 0.014 * this.bobA,
        -0.27 + Math.abs(Math.cos(this.bobT)) * 0.012 * this.bobA - (1 - e) * 0.45,
        -0.5 + this.kick * 0.12
      );
      g.rotation.set(
        -(1 - e) * 0.7 + this.kick * 0.18,
        Math.sin(this.bobT * 0.5) * 0.018 * this.bobA + switchTilt,
        -switchTilt * 0.7 - dashTilt
      );
    }

    if (this.cur.id === "plasma" && this.models.plasma.userData.core) {
      const core = this.models.plasma.userData.core;
      const pulse = 0.5 + 0.5 * Math.sin(Date.now() * 0.01);
      core.scale.setScalar(0.9 + 0.25 * pulse);
      core.material.emissiveIntensity = 0.6 + 0.6 * pulse;
    }

    if (this.cur.id === "rocket") {
      this.smokeT = (this.smokeT || 0) - dt;
      if (this.smokeT <= 0) {
        this.smokeT = 0.09;
        this.camera.getWorldDirection(this.dir);
        this.right.set(1, 0, 0).applyQuaternion(this.camera.quaternion);
        this.up.set(0, 1, 0).applyQuaternion(this.camera.quaternion);
        const rearPos = this.tmpA.copy(this.camera.position)
          .addScaledVector(this.dir, 0.15)
          .addScaledVector(this.right, 0.35)
          .addScaledVector(this.up, -0.22);
        this.fx.spawn(
          rearPos.x, rearPos.y, rearPos.z,
          rnd(0.12) - this.dir.x * 0.6,
          rnd(0.12) + 0.25 - this.dir.y * 0.6,
          rnd(0.12) - this.dir.z * 0.6,
          0xb8b6c8, 0.13, 0.45, -0.4, 0.9
        );
      }
    }

    this.flashT = Math.max(0, this.flashT - dt); this.lightT = Math.max(0, this.lightT - dt);
    this.models[this.cur.id].userData.flash.visible = this.flashT > 0;
    this.camera.getWorldDirection(this.dir);
    this.right.set(1, 0, 0).applyQuaternion(this.camera.quaternion);
    this.up.set(0, 1, 0).applyQuaternion(this.camera.quaternion);
    this.mLight.position.copy(this.camera.position).addScaledVector(this.dir, 0.9).addScaledVector(this.right, 0.3).addScaledVector(this.up, -0.2);
    this.mLight.intensity = 3 * this.lightT / 0.08;
  }

  updateHud(dt) {
    if (this.hitT > 0) {
      this.hitT -= dt;
      this.ui.hit.style.opacity = Math.max(0, this.hitT / 0.18);
      this.ui.hit.classList.toggle("kill", this.hitKill);
    }
    const txt = this.cur.ammo + " / " + this.cur.cfg.maxAmmo;
    if (txt !== this.ammoText) { this.ammoText = txt; this.ui.ammo.innerHTML = this.cur.ammo + " <small>/ " + this.cur.cfg.maxAmmo + "</small>"; }

    const P = this.player;
    this.ui.hpVal.textContent = Math.round(P.health);
    this.ui.hpFill.style.width = Math.max(0, (P.health / P.maxHealth) * 100) + "%";
    this.ui.apVal.textContent = Math.round(P.armor);
    this.ui.apFill.style.width = Math.max(0, (P.armor / P.maxArmor) * 100) + "%";

    const isLowHp = P.health > 0 && P.health < 25;
    this.ui.vignette.classList.toggle("low-hp", isLowHp);
    if (P.vignetteT > 0) {
      this.ui.vignette.style.opacity = Math.min(1, P.vignetteT / 0.25);
    } else if (!isLowHp) {
      this.ui.vignette.style.opacity = "0";
    }

    if (P.dmgIndicatorT > 0) {
      const dx = P.dmgSourcePos.x - P.pos.x, dz = P.dmgSourcePos.z - P.pos.z;
      const angleToSource = Math.atan2(dx, dz);
      const relAngle = angleToSource - P.yaw;
      this.ui.dmgArc.style.transform = "rotate(" + (-relAngle) + "rad)";
      this.ui.dmgIndicator.style.opacity = Math.min(1, P.dmgIndicatorT / 0.4);
    } else {
      this.ui.dmgIndicator.style.opacity = "0";
    }
  }

  update(dt, zombies) {
    const W = this.cur;
    for (const w of this.weapons) w.cool = Math.max(0, w.cool - dt);
    this.switchT = Math.max(0, this.switchT - dt);
    if (!this.player.isDead && !this.gloryActive && this.mouseDown && W.cool <= 0 && this.switchT <= 0 && W.ammo > 0) {
      this.fire(W, zombies);
    }
    this.updateProjectiles(dt, zombies);
    this.updateGloryKill(dt);
    this.fx.update(dt);
    for (const t of this.targets) t.update(dt);
    this.updateView(dt);
    this.updateHud(dt);
  }

  resize() { this.wCam.aspect = innerWidth / innerHeight; this.wCam.updateProjectionMatrix(); }

  render(r) {
    r.clear(); r.render(this.scene, this.camera);
    r.clearDepth(); r.render(this.wScene, this.wCam);
  }
}

/* ===================== МЕНЕДЖЕР ИГРЫ, ВОЛН И ПРЕДМЕТОВ ===================== */
class Game {
  constructor() {
    this.renderer = new THREE.WebGLRenderer({ antialias: true });
    this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    this.renderer.setSize(innerWidth, innerHeight);
    document.body.prepend(this.renderer.domElement);

    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(CONFIG.fov, innerWidth / innerHeight, 0.1, 200);
    this.world = new World(this.scene);
    this.player = new Player(this.camera);
    this.renderer.autoClear = false;
    this.combat = new Combat(this.scene, this.camera, this.world, this.player, this);

    this.zombies = [];
    this.pickups = [];
    this.wave = 1;
    this.kills = 0;
    this.gloryKills = 0;
    this.score = 0;
    this.waveDelay = 0;
    this.wavePending = false;
    this.killsSinceQuote = 0;
    this.timeScale = 1.0;

    this.keys = {};
    this.running = false;
    this.clock = new THREE.Clock();
    this.frames = 0; this.fpsTime = 0;
    this.quoteTimer = 0;
    this.flashTimer = 0;

    this.el = {
      overlay: document.getElementById("overlay"),
      title: document.getElementById("title"),
      deathScreen: document.getElementById("deathScreen"),
      deathStats: document.getElementById("deathStats"),
      restartBtn: document.getElementById("restartBtn"),
      dash: document.getElementById("dash"),
      dashFill: document.getElementById("dashFill"),
      dashLabel: document.getElementById("dashLabel"),
      fps: document.getElementById("fps"),
      waveBadge: document.getElementById("waveBadge"),
      killsBadge: document.getElementById("killsBadge"),
      scoreBadge: document.getElementById("scoreBadge"),
      waveBanner: document.getElementById("waveBanner"),
      quoteBox: document.getElementById("quoteBox"),
      pickupFlash: document.getElementById("pickupFlash")
    };

    this.bind();
    this.spawnStartPickups();
    this.spawnWave(6);
    this.loop();
  }

  bind() {
    const canvas = this.renderer.domElement;
    this.el.overlay.addEventListener("click", () => canvas.requestPointerLock());

    this.el.restartBtn.addEventListener("click", () => {
      this.restartGame();
      canvas.requestPointerLock();
    });

    document.addEventListener("pointerlockchange", () => {
      this.running = document.pointerLockElement === canvas;
      if (this.player.isDead) {
        this.el.overlay.classList.add("hidden");
        return;
      }
      this.el.overlay.classList.toggle("hidden", this.running);
      this.combat.mouseDown = false;
      if (this.running) this.clock.getDelta();
      else { this.keys = {}; this.el.title.textContent = "Пауза — нажми, чтобы продолжить"; }
    });

    document.addEventListener("mousemove", e => {
      if (this.running && !this.player.isDead && !this.combat.gloryActive) {
        this.player.look(e.movementX, e.movementY);
      }
    });

    document.addEventListener("keydown", e => {
      if (this.player.isDead) {
        if (e.code === "KeyR") this.restartGame();
        return;
      }
      if (!this.running) return;
      if (this.combat.gloryActive) return;

      if (e.code === "Space") { e.preventDefault(); if (!e.repeat) this.player.jumpQueued = true; }
      else if (e.code === "ShiftLeft" || e.code === "ShiftRight") { if (!e.repeat) this.player.dashQueued = true; }
      else if (e.code === "KeyE") { if (!e.repeat) this.combat.tryGloryKill(this.zombies); }
      else if (/^Digit[1-3]$/.test(e.code)) this.combat.select(+e.code[5] - 1);
      else if (e.code === "KeyR") this.combat.refill();
      else if (e.code === "KeyT") this.spawnZombie();
      else this.keys[e.code] = true;
    });

    document.addEventListener("keyup", e => { this.keys[e.code] = false; });
    document.addEventListener("mousedown", e => {
      if (this.player.isDead || this.combat.gloryActive) return;
      if (this.running && e.button === 0) this.combat.mouseDown = true;
    });
    document.addEventListener("mouseup", e => { if (e.button === 0) this.combat.mouseDown = false; });
    document.addEventListener("wheel", e => {
      if (this.running && !this.player.isDead && !this.combat.gloryActive) {
        this.combat.cycle(Math.sign(e.deltaY));
      }
    }, { passive: true });

    window.addEventListener("resize", () => {
      this.combat.resize();
      this.camera.aspect = innerWidth / innerHeight;
      this.camera.updateProjectionMatrix();
      this.renderer.setSize(innerWidth, innerHeight);
    });
  }

  triggerFlash(color) {
    this.el.pickupFlash.className = color;
    this.el.pickupFlash.style.opacity = "1";
    this.flashTimer = 0.22;
  }

  sayQuote(category) {
    if (this.quoteTimer > 0) return;
    this.quoteTimer = 4.0;
    const list = CONFIG.quotes[category + "Quotes"] || CONFIG.quotes.killQuotes;
    const txt = list[Math.floor(Math.random() * list.length)];
    this.el.quoteBox.textContent = "Вася: " + txt;
    this.el.quoteBox.classList.add("show");
    setTimeout(() => this.el.quoteBox.classList.remove("show"), 1500);
  }

  showWaveBanner(text) {
    this.el.waveBanner.textContent = text;
    this.el.waveBanner.classList.add("show");
    setTimeout(() => this.el.waveBanner.classList.remove("show"), 2000);
  }

  onZombieKill(points, isHeadshot, isGloryKill = false) {
    this.kills++;
    if (isGloryKill) this.gloryKills++;
    this.score += points;
    this.killsSinceQuote++;
    if (this.killsSinceQuote >= 3) {
      this.killsSinceQuote = 0;
      this.sayQuote("kill");
    }
    this.el.killsBadge.textContent = "УБИТО: " + this.kills + " | ДОБИТО: " + this.gloryKills;
    this.el.scoreBadge.textContent = "СЧЁТ: " + this.score;
  }

  // Спавн предметов при смерти зомби
  spawnDrops(pos, isGloryKill, wasStunned) {
    const addP = (type, vx, vy, vz) => {
      if (this.pickups.length >= CONFIG.pickups.maxActive) {
        const oldest = this.pickups.shift();
        oldest.destroy();
      }
      const p = new Pickup(this.scene, type, pos.x, pos.y + 0.8, pos.z, new THREE.Vector3(vx, vy, vz));
      this.pickups.push(p);
    };

    if (isGloryKill) {
      // При добивании: 2 аптечки, 1 патроны (где меньше всего запас) и 40% броня
      addP("medkit", -1.2, 4.2, rnd(1));
      addP("medkit", 1.2, 4.2, rnd(1));

      // Находим оружие с наименьшим % патронов
      const wpns = this.combat.weapons;
      let minRatio = wpns[0].ammo / wpns[0].cfg.maxAmmo;
      let minType = "ammo_shotgun";
      if (wpns[1].ammo / wpns[1].cfg.maxAmmo < minRatio) {
        minRatio = wpns[1].ammo / wpns[1].cfg.maxAmmo;
        minType = "ammo_plasma";
      }
      if (wpns[2].ammo / wpns[2].cfg.maxAmmo < minRatio) {
        minType = "ammo_rocket";
      }
      addP(minType, rnd(1), 4.5, -1.2);

      if (Math.random() < CONFIG.drops.gloryArmorChance) {
        addP("armor", rnd(1), 4.8, 1.2);
      }
    } else {
      const chance = wasStunned ? CONFIG.drops.stunnedKillChance : CONFIG.drops.normalAmmoChance;
      if (Math.random() < chance) {
        const ammoTypes = ["ammo_shotgun", "ammo_plasma", "ammo_rocket"];
        addP(ammoTypes[Math.floor(Math.random() * ammoTypes.length)], rnd(1.2), 3.8, rnd(1.2));
      }
      const hpChance = wasStunned ? 0.25 : CONFIG.drops.normalHpChance;
      if (Math.random() < hpChance) {
        addP("medkit", rnd(1.2), 3.8, rnd(1.2));
      }
    }
  }

  spawnStartPickups() {
    // 4 аптечки
    const medCoords = [[-10, 0, -8], [4, 3, -12], [12, 0, 2], [-4, 2, -12]];
    for (const c of medCoords) {
      const p = new Pickup(this.scene, "medkit", c[0], c[1], c[2], new THREE.Vector3(0, 0, 0));
      p.hovering = true; p.hoverBaseY = c[1] + 0.35;
      this.pickups.push(p);
    }
    // 2 брони
    const armorCoords = [[0, 1.8, -2], [12, 4.5, -8]];
    for (const c of armorCoords) {
      const p = new Pickup(this.scene, "armor", c[0], c[1], c[2], new THREE.Vector3(0, 0, 0));
      p.hovering = true; p.hoverBaseY = c[1] + 0.35;
      this.pickups.push(p);
    }
    // Патроны дробовика (2)
    const sgCoords = [[-12, 2.5, 6], [0, 0, 8]];
    for (const c of sgCoords) {
      const p = new Pickup(this.scene, "ammo_shotgun", c[0], c[1], c[2], new THREE.Vector3(0, 0, 0));
      p.hovering = true; p.hoverBaseY = c[1] + 0.35;
      this.pickups.push(p);
    }
    // Патроны плазмы (2)
    const plCoords = [[-10, 1, -8], [14, 0, -14]];
    for (const c of plCoords) {
      const p = new Pickup(this.scene, "ammo_plasma", c[0], c[1], c[2], new THREE.Vector3(0, 0, 0));
      p.hovering = true; p.hoverBaseY = c[1] + 0.35;
      this.pickups.push(p);
    }
    // Патроны ракет (2)
    const rkCoords = [[4, 0, -6], [-14, 0, 12]];
    for (const c of rkCoords) {
      const p = new Pickup(this.scene, "ammo_rocket", c[0], c[1], c[2], new THREE.Vector3(0, 0, 0));
      p.hovering = true; p.hoverBaseY = c[1] + 0.35;
      this.pickups.push(p);
    }
  }

  onPlayerDeath() {
    this.el.deathStats.innerHTML =
      "Волна: " + this.wave + "<br>Убито зомби: " + this.kills +
      "<br>Добиваний (Glory): " + this.gloryKills + "<br>Общий счёт: " + this.score;
    this.el.deathScreen.classList.add("active");
  }

  restartGame() {
    for (const z of this.zombies) z.destroy();
    for (const p of this.pickups) p.destroy();
    this.zombies = [];
    this.pickups = [];
    this.wave = 1;
    this.kills = 0;
    this.gloryKills = 0;
    this.score = 0;
    this.waveDelay = 0;
    this.wavePending = false;
    this.timeScale = 1.0;
    this.player.reset();
    this.combat.refill();
    this.combat.gloryActive = false;
    this.el.deathScreen.classList.remove("active");
    this.el.waveBadge.textContent = "ВОЛНА: 1";
    this.el.killsBadge.textContent = "УБИТО: 0 | ДОБИТО: 0";
    this.el.scoreBadge.textContent = "СЧЁТ: 0";
    this.spawnStartPickups();
    this.spawnWave(6);
  }

  findSpawnPoint() {
    const half = CONFIG.roomSize / 2 - 3;
    for (let attempts = 0; attempts < 40; attempts++) {
      const rx = (Math.random() - 0.5) * 2 * half;
      const rz = (Math.random() - 0.5) * 2 * half;
      const dist = Math.hypot(rx - this.player.pos.x, rz - this.player.pos.z);
      if (dist < 12) continue;

      let inBox = false;
      for (const b of this.world.boxes) {
        if (rx >= b.min.x - 0.8 && rx <= b.max.x + 0.8 &&
            rz >= b.min.z - 0.8 && rz <= b.max.z + 0.8) {
          inBox = true; break;
        }
      }
      if (!inBox) return { x: rx, y: 0, z: rz };
    }
    return { x: 12, y: 0, z: -12 };
  }

  spawnZombie() {
    const pt = this.findSpawnPoint();
    const z = new Zombie(this.scene, pt.x, pt.y, pt.z);
    this.zombies.push(z);
  }

  spawnWave(count) {
    this.showWaveBanner("ВОЛНА " + this.wave);
    this.el.waveBadge.textContent = "ВОЛНА: " + this.wave;
    for (let i = 0; i < count; i++) {
      this.spawnZombie();
    }
  }

  updateWaves(dt) {
    const aliveCount = this.zombies.filter(z => z.alive).length;
    if (aliveCount === 0 && !this.wavePending && !this.player.isDead) {
      this.wavePending = true;
      this.waveDelay = 3.0;
      this.showWaveBanner("ВОЛНА ЗАЧИЩЕНА!");
    }

    if (this.wavePending) {
      this.waveDelay -= dt;
      if (this.waveDelay <= 0) {
        this.wavePending = false;
        this.wave++;
        for (const z of this.zombies) z.destroy();
        this.zombies = [];
        const nextCount = Math.min(20, 6 + (this.wave - 1) * 3);
        this.spawnWave(nextCount);
      }
    }
  }

  updateHud(dt) {
    const cd = this.player.dashCd, ready = cd <= 0;
    this.el.dashFill.style.width = (ready ? 100 : (1 - cd / CONFIG.dashCooldown) * 100) + "%";
    this.el.dash.classList.toggle("charging", !ready);
    this.el.dashLabel.textContent = ready ? "Рывок готов" : "Рывок: " + cd.toFixed(1) + " с";

    this.frames++; this.fpsTime += dt;
    if (this.fpsTime >= 0.5) {
      this.el.fps.textContent = "FPS: " + Math.round(this.frames / this.fpsTime);
      this.frames = 0; this.fpsTime = 0;
    }

    if (this.quoteTimer > 0) this.quoteTimer -= dt;

    if (this.flashTimer > 0) {
      this.flashTimer -= dt;
      if (this.flashTimer <= 0) {
        this.el.pickupFlash.style.opacity = "0";
      }
    }
  }

  loop() {
    requestAnimationFrame(() => this.loop());
    const rawDt = Math.min(this.clock.getDelta(), 0.05);
    const dt = rawDt * this.timeScale;

    if (this.running || this.player.isDead) {
      this.player.update(dt, this.keys, this.world, this.combat.gloryActive);

      for (const z of this.zombies) {
        z.update(dt, this.player, this.world, this.zombies, this, this.combat.fx);
      }

      for (let i = this.pickups.length - 1; i >= 0; i--) {
        const p = this.pickups[i];
        p.update(dt, this.player, this, this.combat.fx);
        if (!p.alive) this.pickups.splice(i, 1);
      }

      this.combat.update(dt, this.zombies);
      this.updateWaves(dt);
      this.updateHud(rawDt);
    }
    this.combat.render(this.renderer);
  }
}

new Game();
</script>
